schema_version: 1
installation:
  name: gatehouse-local
  timezone: Asia/Kolkata
server:
  agent: { host: 127.0.0.1, port: 47621 }
  admin: { host: 127.0.0.1, port: 47622 }
database:
  path: '%LOCALAPPDATA%\Gatehouse\state\gatehouse.db'
  journal_mode: WAL
  synchronous: FULL
  busy_timeout_ms: 5000
sessions:
  access_token_ttl: 10m
  interactive_absolute_ttl: 18h
  unattended_absolute_ttl: 4h
  heartbeat_interval: 30s
  stale_after: 120s
  reconnect_grace: 30m
  maximum_active_access_tokens_per_session: 1
  maximum_bootstrap_exchanges_per_window: 8
  bootstrap_exchange_window: 60s
approvals:
  default_ttl: 5m
  unattended_behavior: deny
  windows_notification: true
  terminal_prompt: false
concurrency:
  maximum_connected_clients: 256
  global_in_flight: 96
  global_queue_depth: 300
  per_session: { maximum_in_flight: 8, maximum_queued: 20 }
  firecrawl:
    maximum_in_flight: 8
    maximum_per_quota_scope: 4
    interactive_queue_depth: 50
    system_reserved_queue_depth: 10
    queue_ttl: 90s
    watcher_reserved_in_flight: 1
routing:
  maximum_total_provider_attempts: 1
  maximum_route_candidates: 32
runaway_detection:
  identical_requests: 5
  aggregate_requests: 20
  window: 30s
  cooldown: 120s
retention:
  maintenance_interval: 15m
  detailed_metadata_age: 60d
  database_size_cap: 2GiB
  debug_excerpt_age: 72h
  debug_excerpt_size_cap: 250MiB
  daily_aggregate_age: 365d
reconciliation:
  quick_interval: 6h
  full_interval: 7d
  maximum_snapshot_age: 30m
  maximum_batch_duration: 30s
  maximum_scopes_per_batch: 20
  absolute_credit_tolerance: 5
  relative_tolerance: 0.02
  consecutive_mismatches: 2
watchdog:
  interval: 2m
  readiness_timeout: 30s
  maximum_restarts: 5
  restart_window: 10m
  crash_loop_cooldown: 15m
providers:
  firecrawl:
    workload:
      mode: disabled
      network_enabled: false
    observer:
      mode: disabled
      network_enabled: false
      interval: 15m
      freshness_ttl: 30m
      request_timeout: 10s
      maximum_accounts_per_cycle: 20
      maximum_concurrency: 1
